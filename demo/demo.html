<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lite-snow Pro Environment</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d111a;
            font-family: system-ui, sans-serif;
            color: #fff;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            width: 320px;
            background: rgba(20, 25, 35, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
        }

        h2 {
            margin: 0 0 15px 0;
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaccff;
        }

        .control-group {
            margin-bottom: 16px;
        }

        label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 6px;
            font-weight: 600;
            color: #d0e0ff;
        }

        input[type=range] {
            width: 100%;
            margin-bottom: 5px;
            accent-color: #ffffff;
        }

        .presets {
            display: flex;
            gap: 8px;
            margin-top: 24px;
        }

        button {
            flex: 1;
            background: #1c2638;
            color: #aaccff;
            border: 1px solid #30405a;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            transition: 0.2s;
        }

        @media (hover: hover) {
            button:hover {
                background: #30405a;
                color: #fff;
            }
        }

        button.active {
            background: #ffffff;
            color: #0d111a;
            border-color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }

        #telemetry {
            margin-top: 20px;
            font-size: 11px;
            font-variant-numeric: tabular-nums;
            letter-spacing: 0.5px;
            color: #8fb3e0;
        }
    </style>
</head>
<body>

<div id="panel">
    <h2>Winter Simulation</h2>

    <div class="control-group">
        <label>Density (Flakes/Area) <span id="denVal">10.0</span></label>
        <input type="range" id="density" min="2" max="40" step="2" value="10">
    </div>

    <div class="control-group">
        <label>Wind Velocity <span id="windVal">30</span></label>
        <input type="range" id="wind" min="-500" max="500" step="10" value="30">
    </div>

    <div class="control-group">
        <label>Gravity (Fall Speed) <span id="gravVal">40</span></label>
        <input type="range" id="gravity" min="10" max="500" step="10" value="40">
    </div>

    <div class="control-group">
        <label>Gust (Horizontal Gale) <span id="gustVal">0</span></label>
        <input type="range" id="gust" min="0" max="600" step="10" value="0">
    </div>

    <div class="control-group">
        <label>Turbulence (Swirl) <span id="turbVal">0</span></label>
        <input type="range" id="turbulence" min="0" max="600" step="10" value="0">
    </div>

    <div class="control-group">
        <label>Drag (Terminal Velocity) <span id="dragVal">1.00</span></label>
        <input type="range" id="drag" min="0.80" max="1.00" step="0.01" value="1.00">
    </div>

    <div class="presets">
        <button id="btnFlurry" class="active">Flurry</button>
        <button id="btnHeavy">Heavy</button>
        <button id="btnBlizzard">Blizzard</button>
    </div>

    <div id="telemetry">active 0 | falling 0 | melting 0</div>
</div>

<canvas id="stage"></canvas>

<script type="module">
    // Thin shell: build the real DOM env, hand it to the importable controller.
    // The engine is the LOCAL repo build (../SnowEngine.js), so the demo
    // exercises the code in this checkout, not a pinned esm.run release.
    import { SnowEngine, SNOW_PRESETS } from '../SnowEngine.js';
    import { createSnowDemo } from './SnowDemo.js';

    const engine = new SnowEngine(10000, SNOW_PRESETS.flurry);
    createSnowDemo({ window, document, engine });
</script>
</body>
</html>
